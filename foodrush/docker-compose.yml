version: '3.8'

services:
  # ─── Databases ───────────────────────────────────────────
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: foodrush
      POSTGRES_PASSWORD: foodrush123
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrush"]
      interval: 10s
      retries: 5
    networks:
      - foodrush-net

  restaurant-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: foodrush
      POSTGRES_PASSWORD: foodrush123
    volumes:
      - restaurant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrush"]
      interval: 10s
      retries: 5
    networks:
      - foodrush-net

  order-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: foodrush
      POSTGRES_PASSWORD: foodrush123
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrush"]
      interval: 10s
      retries: 5
    networks:
      - foodrush-net

  # ─── Microservices ────────────────────────────────────────
  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://foodrush:foodrush123@user-db:5432/userdb
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - foodrush-net
    restart: unless-stopped

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://foodrush:foodrush123@restaurant-db:5432/restaurantdb
    depends_on:
      restaurant-db:
        condition: service_healthy
    networks:
      - foodrush-net
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://foodrush:foodrush123@order-db:5432/orderdb
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - foodrush-net
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      USER_SERVICE_URL: http://user-service:8001
      RESTAURANT_SERVICE_URL: http://restaurant-service:8002
      ORDER_SERVICE_URL: http://order-service:8003
    depends_on:
      - user-service
      - restaurant-service
      - order-service
    networks:
      - foodrush-net
    restart: unless-stopped

volumes:
  user-db-data:
  restaurant-db-data:
  order-db-data:

networks:
  foodrush-net:
    driver: bridge
